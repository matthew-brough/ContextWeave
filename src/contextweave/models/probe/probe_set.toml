[state]
query = "where is the retry logic for failed model calls"
card = """path: src/contextweave/models/slots.py
name: ModelSlots.call
kind: method
rels: calls record_failure, called_by embed, annotate
annotation: runs one model call on the active device and converts failures into skipped results
code: def call(self, slot, fn, stage=None):
    health = self.healths[slot]
    device = health.acquire()
    if device is None:
        health.record_unavailable()
        return Skipped(DegradedEntry(stage=stage, reason=health.unavailable_reason()))
"""

