[[chunks]]
path = "src/budget.py"
kind = "class"
name = "Ceiling"
code = """class Ceiling:
    limit: int

    def fits(self, used):
        return used <= self.limit

    def over_by(self, used):
        return max(0, used - self.limit)"""

