path = "src/store.py"
kind = "function"
name = "upsert_file"
code = """def upsert_file(conn, path, content_hash, mtime_ns, size):
    conn.execute(
        "INSERT INTO files(path, hash, mtime_ns, size) VALUES (?, ?, ?, ?) "
        "ON CONFLICT(path) DO UPDATE SET hash = excluded.hash, mtime_ns = excluded.mtime_ns",
        (path, content_hash, mtime_ns, size),
    )"""

[[chunks]]
path = "src/walk.py"
kind = "function"
name = "iter_sources"
code = """def iter_sources(root, ignore):
    for current, dirs, files in os.walk(root):
        dirs[:] = [name for name in dirs if name not in ignore]
        for name in files:
            if not is_binary(Path(current, name)):
                yield Path(current, name)"""

