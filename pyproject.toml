[project]
name = "contextweave-mcp"
version = "0.3.0"
description = "Unified code-context MCP server: structural, lexical and semantic retrieval"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "artemOP", email = "matthew.brough123890@gmail.com" }]
keywords = ["mcp", "tree-sitter", "code-search", "retrieval", "embeddings", "claude", "codex", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "msgpack>=1.2.3",
    "pathspec>=1.1.1",
    "pydantic>=2.14.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.2",
    "tomli-w>=1.2.0",
    "tree-sitter==0.26.*",
    "tree-sitter-language-pack>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/matthew-brough/ContextWeave"
Repository = "https://github.com/matthew-brough/ContextWeave"
Issues = "https://github.com/matthew-brough/ContextWeave/issues"

[project.scripts]
contextweave = "contextweave.cli:main"
cw = "contextweave.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "contextweave"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures"]
stubPath = "typings"
extraPaths = ["src", "tests/support"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF", "SIM", "PTH", "PGH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests/support"]
markers = ["daemon: needs unix-socket daemon (Linux/WSL2 only)"]
